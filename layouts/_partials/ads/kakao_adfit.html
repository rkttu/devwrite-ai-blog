{{- if and hugo.IsProduction (not .Draft) .Site.Params.integrations.kakaoadfit }}
{{- with .Site.Params.kakaoadfit }}
<div class="kakao-adfit-container" style="text-align: center; margin: 1.5em 0;">
  <ins class="kakao_ad_area" style="display:none;"
    data-ad-unit="{{ .adunit }}"
    data-ad-width="{{ .width }}"
    data-ad-height="{{ .height }}"></ins>
  <script type="text/javascript" charset="utf-8" src="https://t1.kakaocdn.net/kas/static/ba.min.js" async></script>
</div>
{{- end }}
{{- end }}
