name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지
concurrency:
  group: "pages"
  cancel-in-progress: false

# 기본 쉘 설정
defaults:
  run:
    shell: bash

jobs:
  # 빌드 작업
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Cache Hugo binary
        id: cache-hugo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.deb
          key: hugo-${{ env.HUGO_VERSION }}

      - name: Download Hugo CLI
        if: steps.cache-hugo.outputs.cache-hit != 'true'
        run: |
          wget \
            -O "${RUNNER_TEMP}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

      - name: Verify Hugo CLI checksum
        run: |
          package="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          wget \
            -O "${RUNNER_TEMP}/hugo_checksums.txt" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          (
            cd "${RUNNER_TEMP}"
            grep "  ${package}$" hugo_checksums.txt | sha256sum --check --strict
          )

      - name: Install Hugo CLI
        run: sudo dpkg -i "${RUNNER_TEMP}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Validate source content
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_translations.py
          python scripts/check_asset_sizes.py

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Seoul
        run: |
          hugo \
            --environment production \
            --cleanDestinationDir \
            --gc \
            --minify \
            --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --buildDrafts=false

      - name: Publish root fallback files
        run: |
          cp public/ko/404.html public/404.html
          cp public/ko/llms.txt public/llms.txt

      - name: Validate production output
        run: python scripts/validate_site.py public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public

  # 배포 작업
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
