name: Kit Newsletter Broadcast

on:
  workflow_dispatch:
    inputs:
      post_path:
        description: '수동 발송할 포스트 경로 (예: content/ko/posts/2026-02-08-my-post/index.md)'
        required: true
      send_at:
        description: '예약 발송 시각 ISO8601 (비우면 드래프트 저장)'
        required: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate post path
        id: detect
        env:
          INPUT_POST_PATH: ${{ inputs.post_path }}
          OUTPUT_PATH: ${{ runner.temp }}/changed_posts.txt
        run: |
          set -euo pipefail
          python scripts/detect_published_posts.py \
            --post-path "$INPUT_POST_PATH" \
            --output "$OUTPUT_PATH"
          if [ -s "$OUTPUT_PATH" ]; then
            echo "has_posts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_posts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Kit broadcast
        if: steps.detect.outputs.has_posts == 'true'
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_SEND_AT: ${{ inputs.send_at }}
          BASE_URL: 'https://devwrite.ai'
          DEFAULT_LANG: 'ko'
          OUTPUT_PATH: ${{ runner.temp }}/changed_posts.txt
        run: |
          set -euo pipefail
          export CHANGED_FILES="$(cat "$OUTPUT_PATH")"
          python scripts/kit_broadcast.py
