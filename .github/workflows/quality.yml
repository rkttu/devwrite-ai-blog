name: Validate Hugo site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Hugo binary
        id: cache-hugo
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo.deb
          key: hugo-${{ env.HUGO_VERSION }}

      - name: Download Hugo CLI
        if: steps.cache-hugo.outputs.cache-hit != 'true'
        run: wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb

      - name: Install Hugo CLI
        run: sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate source content
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_translations.py
          python scripts/check_asset_sizes.py

      - name: Build production site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          TZ: Asia/Seoul
        run: |
          hugo \
            --environment production \
            --gc \
            --minify \
            --panicOnWarning \
            --buildDrafts=false
          cp public/ko/404.html public/404.html
          cp public/ko/llms.txt public/llms.txt

      - name: Validate production output
        run: python scripts/validate_site.py public
